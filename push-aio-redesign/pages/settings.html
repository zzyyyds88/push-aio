    <title>系统设置</title>
    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;
  --radius-sm: 0.5rem;
  --radius-md: 0.75rem;
  --radius-lg: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    </style>

            <div class="max-w-[640px] mx-auto space-y-6">

              <!-- Panel 1: 修改 API Key -->
              <section class="rounded-xl p-6" style="background-color: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
                <div class="flex items-start gap-3">
                  <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background-color: var(--brand-50);">
                    <i data-lucide="key" class="w-[18px] h-[18px]" style="color: var(--primary);"></i>
                  </div>
                  <div class="min-w-0">
                    <h2 class="text-[17px] font-semibold tracking-tight" style="color: var(--card-foreground);">修改 API Key</h2>
                    <p class="text-sm mt-0.5" style="color: var(--muted-foreground);">WebUI 登录密码与外部调用 Key 是同一把</p>
                  </div>
                </div>

                <div class="mt-5 space-y-4">
                  <!-- 新 Key -->
                  <div>
                    <div class="flex items-baseline justify-between mb-1.5">
                      <label for="new-key" class="text-sm font-medium" style="color: var(--foreground);">新 Key</label>
                      <span class="text-xs" style="color: var(--muted-foreground);">至少 12 位</span>
                    </div>
                    <input id="new-key" type="password" placeholder="输入新 Key（至少 12 位）" class="w-full h-11 px-3.5 text-base rounded-lg outline-none transition focus:ring-2" style="background-color: var(--background); border: 1px solid var(--border); color: var(--foreground); --tw-ring-color: var(--ring);">
                    <!-- Strength indicator (static) -->
                    <div class="mt-2 flex items-center gap-2">
                      <div class="flex gap-1">
                        <span class="w-8 h-1 rounded-full" style="background-color: var(--state-error);"></span>
                        <span class="w-8 h-1 rounded-full" style="background-color: var(--background-300);"></span>
                        <span class="w-8 h-1 rounded-full" style="background-color: var(--background-300);"></span>
                        <span class="w-8 h-1 rounded-full" style="background-color: var(--background-300);"></span>
                      </div>
                      <span class="text-xs" style="color: var(--muted-foreground);">强度：弱 · 建议混合字母、数字与符号</span>
                    </div>
                  </div>

                  <!-- 确认新 Key -->
                  <div>
                    <label for="confirm-key" class="text-sm font-medium block mb-1.5" style="color: var(--foreground);">确认新 Key</label>
                    <input id="confirm-key" type="password" placeholder="再次输入新 Key" class="w-full h-11 px-3.5 text-base rounded-lg outline-none transition focus:ring-2" style="background-color: var(--background); border: 1px solid var(--border); color: var(--foreground); --tw-ring-color: var(--ring);">
                  </div>

                  <!-- Save button -->
                  <div class="pt-1">
                    <button class="h-11 px-5 rounded-lg text-sm font-medium inline-flex items-center gap-2 transition" style="background-color: var(--primary); color: var(--primary-foreground);">
                      <i data-lucide="check" class="w-4 h-4"></i>
                      <span>保存新 Key</span>
                    </button>
                  </div>

                  <p class="text-xs leading-relaxed" style="color: var(--muted-foreground);">修改后立即生效，写入数据库。当前浏览器需用新 Key 重新登录。</p>
                </div>
              </section>

              <!-- Panel 2: 会话管理 -->
              <section class="rounded-xl p-6" style="background-color: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
                <div class="flex items-start gap-3">
                  <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background-color: var(--secondary);">
                    <i data-lucide="shield" class="w-[18px] h-[18px]" style="color: var(--foreground);"></i>
                  </div>
                  <div class="min-w-0">
                    <h2 class="text-[17px] font-semibold tracking-tight" style="color: var(--card-foreground);">会话管理</h2>
                  </div>
                </div>

                <p class="text-sm mt-4" style="color: var(--muted-foreground);">当前浏览器已保存 API Key，可清除后重新登录。</p>

                <div class="mt-4">
                  <button class="h-11 px-5 rounded-lg text-sm font-medium inline-flex items-center gap-2 transition" style="background-color: transparent; color: var(--destructive); border: 1px solid var(--border);">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span>清除浏览器 Key 并重新登录</span>
                  </button>
                </div>
              </section>

              <!-- Panel 3: 系统信息 -->
              <section class="rounded-xl p-6" style="background-color: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
                <div class="flex items-start gap-3 mb-2">
                  <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background-color: var(--secondary);">
                    <i data-lucide="info" class="w-[18px] h-[18px]" style="color: var(--foreground);"></i>
                  </div>
                  <div class="min-w-0">
                    <h2 class="text-[17px] font-semibold tracking-tight" style="color: var(--card-foreground);">系统信息</h2>
                  </div>
                </div>

                <dl class="mt-3">
                  <div class="flex items-center justify-between py-3">
                    <dt class="text-sm" style="color: var(--muted-foreground);">版本</dt>
                    <dd class="text-sm font-medium" style="color: var(--foreground);">v1.0.0</dd>
                  </div>
                  <div class="flex items-center justify-between py-3" style="border-top: 1px solid var(--border);">
                    <dt class="text-sm" style="color: var(--muted-foreground);">运行端口</dt>
                    <dd class="text-sm font-medium font-mono" style="color: var(--foreground);">8080</dd>
                  </div>
                  <div class="flex items-center justify-between py-3" style="border-top: 1px solid var(--border);">
                    <dt class="text-sm" style="color: var(--muted-foreground);">渠道类型</dt>
                    <dd class="text-sm font-medium" style="color: var(--foreground);">23 种</dd>
                  </div>
                  <div class="flex items-center justify-between py-3" style="border-top: 1px solid var(--border);">
                    <dt class="text-sm" style="color: var(--muted-foreground);">数据存储</dt>
                    <dd class="text-sm font-medium" style="color: var(--foreground);">SQLite（本地数据库）</dd>
                  </div>
                  <div class="flex items-center justify-between py-3" style="border-top: 1px solid var(--border);">
                    <dt class="text-sm" style="color: var(--muted-foreground);">API 文档</dt>
                    <dd>
                      <a href="/api/help" class="text-sm font-medium inline-flex items-center gap-1" style="color: var(--primary);">
                        <span class="font-mono">/api/help</span>
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                      </a>
                    </dd>
                  </div>
                </dl>
              </section>

            </div>
          </div>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
